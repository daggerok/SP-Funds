name: Update SP Funds ETF data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space/comma/semicolon ticker allowlist; combined with every filter using AND; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      max_fetches:
        description: "Batch size; 0 is a full selected pass; positive resumes the saved scoped cursor; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Minimum seconds between request starts in each independent lane, including retries; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel fund workers and independent paced request lanes; keep low; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      aum:
        description: "USD min:max, K/M/B/T amounts or nano/micro/small/mid/large preset; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      ter:
        description: "Gross expense ratio percent min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Distribution-yield percent min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      sec_yield:
        description: "Published 30-day SEC yield percent min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      holdings_page_size:
        description: "Current holdings rows per JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_page_size:
        description: "Daily history rows per JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request (integer >= 1, transient HTTP/network failures only); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_range:
        description: "Yahoo Finance history window: max or <N>y, e.g. 5y; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "YTD performance percent min:max (3Y/5Y/10Y annualized); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "1Y performance percent min:max (3Y/5Y/10Y annualized); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "3Y performance percent min:max (3Y/5Y/10Y annualized); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "5Y performance percent min:max (3Y/5Y/10Y annualized); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_10y:
        description: "10Y performance percent min:max (3Y/5Y/10Y annualized); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "YTD cumulative total return percent min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "1Y cumulative total return percent min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "3Y cumulative total return percent min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "5Y cumulative total return percent min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_10y:
        description: "10Y cumulative total return percent min:max; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_spfunds:
        description: "Skip the official sp-funds.com fund pages (keeps published facts); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_yahoo:
        description: "Skip Yahoo Finance (keeps published history/dividends); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      advanced:
        description: 'JSON object of supported control overrides not exposed above (keys are UPPER_CASE control names, values are scalars); nonblank individual inputs win'
        required: false
        default: '{}'
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run updater unit tests
        run: bun test
      - name: Resolve file defaults and manual overrides
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
          PROTECTED_SEC_UA: ${{ vars.SEC_UA }}
        run: |
          bun --eval '
            import { resolveControls } from "./scripts/update-data.ts";
            import { appendFile } from "node:fs/promises";
            // schedule runs have no dispatch inputs: file defaults apply as-is
            const inputs = JSON.parse(process.env.DISPATCH_INPUTS || "{}") || {};
            const advanced = JSON.parse(inputs.advanced || "{}");
            const individual = Object.fromEntries(Object.entries(inputs)
              .filter(([key]) => key !== "advanced")
              .map(([key, value]) => [key.toUpperCase(), value]));
            const file = await Bun.file("scripts/update-data.config.json").json();
            // Protected repository Actions variables: highest precedence, applied only when nonblank (never printed).
            const protectedVars = {};
            if ((process.env.PROTECTED_SEC_UA ?? "").trim()) protectedVars.SEC_UA = process.env.PROTECTED_SEC_UA.trim();
            const controls = resolveControls(file, advanced, individual, protectedVars);
            await appendFile(process.env.GITHUB_ENV,
              Object.entries(controls).map(([key, value]) => `${key}=${value}\n`).join(""));
          '
      - name: Generate api/spfunds static data
        run: bun ./scripts/update-data.ts
      - name: Commit updated data
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add api/spfunds
          if git diff --cached --quiet -- api/spfunds; then
            echo "api/spfunds is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update SP Funds ETF snapshot"
          # Runtime-only auth; no token/header stored in URL, file or Git config.
          push() { git -c credential.helper= -c credential.helper='!f() { if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "$GITHUB_TOKEN"; fi; }; f' push; }
          # main may have moved while the updater ran (merges, other pushes): rebase the data commit and retry
          for attempt in 1 2 3 4; do
            push && exit 0
            echo "push rejected: rebasing onto origin/${GITHUB_REF_NAME} (attempt ${attempt})"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
